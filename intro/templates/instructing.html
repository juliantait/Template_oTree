{{ block content }}

<!--------- ONLY MODIFY instructions_text.html! --------->

<!--------- This file dynamically updates to blocks in instructions_text.html. --------->

{% include '_static/global/html/css_bundle.html' %}
<script src="{% static 'global/js/global.js' %}?v={{ C.STATIC_VERSION }}"></script>

<!--------- Each step's title is the <h2> inside its instruction block in
            instructions_text.html — single source of truth, no fixed page
            title here. --------->

<div class="experimental-screen">
    <div class="screen-card">
        <div class="experimental-header">
            <div class="eyebrow">Please read carefully</div>
        </div>
        <div class="experimental-content">
            <form method="post">
                <div class="instructions">
                    <!-- The slide body is the scroll region on this page (see the
                         scroll-chain note in instructions.css). The step counter
                         and the pager below sit OUTSIDE it, so they stay pinned
                         and Next is reachable without scrolling. -->
                    <div id="instruction-wrapper" class="instruction-wrapper">
                        {% include "intro/instructions_text.html" %}
                        {% include "intro/prequiz_text.html" %}
                    </div>

                    <div class="instruction-progress">
                        <span id="instruction-counter"></span>
                    </div>

                    <div class="instruction-controls">
                        <button type="button" id="prevBtn" class="next-button ghost">
                            Back
                        </button>
                        <button type="button" id="nextBtn" class="next-button">
                            Next
                        </button>
                    </div>

                    {{ if is_debug }}
                    <!-- Testing only: rendered only when settings.DEBUG
                         (OTREE_PRODUCTION unset). -->
                    <div class="debug-tools">
                        <button type="button" class="skip-button" onclick="this.form.submit()">
                            Skip instructions (testing)
                        </button>
                    </div>
                    {{ endif }}
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'global/js/instructions.js' %}?v={{ C.STATIC_VERSION }}"></script>
{{ endblock }}
